name: Repository checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    name: Documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint:docs

  android:
    name: Android build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          cache-read-only: false
      - name: Install pinned Android SDK tools and packages
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        env:
          ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk
        with:
          cmdline-tools-version: '13114758' # 19.0
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - name: Build, lint, and run unit tests
        run: ./gradlew --no-daemon :core:telemetry:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Upload development APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: true
          name: rx8-telemetry-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: true
          name: android-build-reports
          path: |
            app/build/reports/
            core/telemetry/build/reports/
          retention-days: 7

  emulator:
    name: Android emulator smoke tests
    needs: android
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          cache-read-only: false
      - name: Install pinned Android SDK tools and packages
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        env:
          ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk
        with:
          cmdline-tools-version: '13114758' # 19.0
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - name: Expose pinned tools to the emulator runner
        run: ln -s "$ANDROID_HOME/cmdline-tools/13114758" "$ANDROID_HOME/cmdline-tools/latest"
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run UI smoke tests on Android 16
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disk-size: 2048M
          emulator-boot-timeout: 300
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader -no-metrics -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: mkdir -p screenshots; ./gradlew --no-daemon :app:connectedDebugAndroidTest; test_result=$?; adb pull /data/local/tmp/rx8-dashboard.png screenshots/dashboard.png && adb pull /data/local/tmp/rx8-connection.png screenshots/connection.png && adb pull /data/local/tmp/rx8-discovery.png screenshots/discovery.png && adb pull /data/local/tmp/rx8-live.png screenshots/live.png && adb pull /data/local/tmp/rx8-vehicle.png screenshots/vehicle.png && adb pull /data/local/tmp/rx8-favourites.png screenshots/favourites.png && adb pull /data/local/tmp/rx8-trips.png screenshots/trips.png && adb pull /data/local/tmp/rx8-sync.png screenshots/sync.png && adb pull /data/local/tmp/rx8-capabilities.png screenshots/capabilities.png && adb pull /data/local/tmp/rx8-trip-sensors.png screenshots/trip-sensors.png; capture_result=$?; if [ "$test_result" -ne 0 ]; then exit "$test_result"; fi; exit "$capture_result"
      - name: Upload UI test results and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: true
          name: android-emulator-results
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            screenshots/
          retention-days: 7
