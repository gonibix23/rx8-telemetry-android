name: Repository checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint:docs

  android:
    name: Android build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          cache-read-only: false
      - name: Install pinned Android SDK tools and packages
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        env:
          ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk
        with:
          cmdline-tools-version: '13114758' # 19.0
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - name: Build, lint, and run unit tests
        run: ./gradlew --no-daemon :core:telemetry:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Upload development APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rx8-telemetry-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-build-reports
          path: |
            app/build/reports/
            core/telemetry/build/reports/
          retention-days: 7

  emulator:
    name: Android emulator smoke tests
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          cache-read-only: false
      - name: Install pinned Android SDK tools and packages
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        env:
          ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk
        with:
          cmdline-tools-version: '13114758' # 19.0
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - name: Expose pinned tools to the emulator runner
        run: ln -s "$ANDROID_HOME/cmdline-tools/13114758" "$ANDROID_HOME/cmdline-tools/latest"
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run UI smoke tests on Android 16
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disk-size: 2048M
          emulator-boot-timeout: 300
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: mkdir -p screenshots; ./gradlew --no-daemon :app:connectedDebugAndroidTest; test_result=$?; adb pull /data/local/tmp/rx8-dashboard.png screenshots/dashboard.png && adb pull /data/local/tmp/rx8-connection.png screenshots/connection.png && adb pull /data/local/tmp/rx8-discovery.png screenshots/discovery.png; capture_result=$?; if [ "$test_result" -ne 0 ]; then exit "$test_result"; fi; exit "$capture_result"
      - name: Upload UI test results and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-emulator-results
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            screenshots/
          retention-days: 7
