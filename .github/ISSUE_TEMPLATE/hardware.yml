name: Hardware compatibility
description: Record evidence from a vehicle or adapter
title: '[Hardware] '
labels:
  - type:research
  - area:obd
  - needs:hardware
  - status:triage
body:
  - type: textarea
    id: environment
    attributes:
      label: Vehicle and equipment
      description: Year, variant, market, Android, phone, adapter, and app. No full VINs or MAC addresses.
    validations:
      required: true
  - type: textarea
    id: procedure
    attributes:
      label: Procedure
      description: Conditions, steps, protocol, and requests.
    validations:
      required: true
  - type: textarea
    id: results
    attributes:
      label: Results
      description: PIDs, values and units, latency, errors, and reconnection.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Conclusion and next step
      description: What is proven, what failed, and what needs more evidence?
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Data review
      options:
        - label: I have removed VINs, MAC addresses, credentials, and personal data from attachments.
          required: true
