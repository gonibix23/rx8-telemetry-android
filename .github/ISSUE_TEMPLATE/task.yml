name: Task
description: Plan an implementation or documentation task
title: '[Task] '
labels:
  - type:task
  - status:triage
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: One concrete outcome.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Affected files or layers and boundaries.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: A list of checks.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Link prerequisite issues, or state none.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Planned validation
      description: What will be checked, and does it require the real vehicle?
    validations:
      required: true
