name: Bug report
description: Report a reproducible problem
title: '[Bug] '
labels:
  - type:bug
  - status:triage
body:
  - type: textarea
    id: problem
    attributes:
      label: Actual and expected behavior
      description: Describe what happened and what you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Specific steps, frequency, and when the problem occurs.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: App/Android version, phone, vehicle, adapter, protocol, and real or simulated mode.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Redacted logs or screenshots.
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Data review
      options:
        - label: I have removed VINs, MAC addresses, credentials, and personal data from attachments.
          required: true
