# Production stack "gonibix", deployed by Portainer from this file.
# .github/workflows/api.yml pushes :latest and triggers the stack webhook; pull_policy makes
# the redeploy fetch it. To roll back, set a published sha-<commit> tag and redeploy.
services:
  api:
    image: ghcr.io/gonibix23/rx8-telemetry-android-api:latest
    # Portainer's git-stack image pull does not refresh this tag; compose must pull on up.
    pull_policy: always
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/?replicaSet=rs0}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-rx8_telemetry}
      HOST: 0.0.0.0
      PORT: 3000
    ports:
      - "7600:3000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0

  # Single-node replica set: the API requires transactions.
  mongo:
    image: mongo:8.0
    command: ["--replSet", "rs0", "--bind_ip_all"]
    restart: unless-stopped
    volumes:
      - /mnt/rx8/mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status() } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }) }; quit(db.hello().isWritablePrimary ? 0 : 1)"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
